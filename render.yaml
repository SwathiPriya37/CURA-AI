services:
  # ── Python / FastAPI backend ───────────────────────────────────────────────
  - type: web
    name: cura-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # Set this manually in Render dashboard → Environment
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Next.js frontend ──────────────────────────────────────────────────────
  - type: web
    name: cura-ai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # ⚠️ IMPORTANT: Set this to your deployed backend URL in Render dashboard.
      # Example: https://cura-ai-backend.onrender.com
      - key: BACKEND_API_URL
        sync: false
      # Keep for local dev fallback (not used in production)
      - key: NEXT_PUBLIC_API_URL
        sync: false
